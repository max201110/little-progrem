<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Clock</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#e2e8f0;font:16px system-ui}.card{width:min(92vw,520px);padding:2rem;border:1px solid #334155;border-radius:24px;background:#1e293b;text-align:center;box-shadow:0 20px 60px #02061799}h1{font-size:1rem;color:#94a3b8}.time{font:700 clamp(4rem,16vw,8rem)/1.1 ui-monospace;color:#67e8f9;margin:1rem 0}.controls{display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap}button{border:0;border-radius:999px;padding:.75rem 1.2rem;background:#22d3ee;color:#082f49;font-weight:700;cursor:pointer}button.secondary{background:#475569;color:#f8fafc}button:focus-visible{outline:3px solid #facc15;outline-offset:3px}.hint{color:#94a3b8;font-size:.9rem}</style></head>
<body><main class="card"><h1>FOCUS CLOCK · 专注计时器</h1><div class="time" id="time" aria-live="polite">25:00</div><div class="controls"><button id="toggle">开始</button><button class="secondary" id="reset">重置</button><button class="secondary" id="mode">切换 5 分钟</button></div><p class="hint">快捷键：空格开始/暂停，R 重置</p></main><script>
const time=document.querySelector('#time'),toggle=document.querySelector('#toggle'),reset=document.querySelector('#reset'),mode=document.querySelector('#mode');let total=1500,running=false,timer;
function render(){const m=String(Math.floor(total/60)).padStart(2,'0'),s=String(total%60).padStart(2,'0');time.textContent=`${m}:${s}`;document.title=`${m}:${s} · Focus Clock`}
function setRunning(value){running=value;toggle.textContent=running?'暂停':'开始';if(running){timer=setInterval(()=>{if(total>0){total--;render()}else setRunning(false)},1000)}else clearInterval(timer)}
toggle.onclick=()=>setRunning(!running);reset.onclick=()=>{setRunning(false);total=1500;render()};mode.onclick=()=>{setRunning(false);total=total===1500?300:1500;mode.textContent=total===1500?'切换 5 分钟':'切换 25 分钟';render()};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setRunning(!running)}if(e.key.toLowerCase()==='r'){setRunning(false);total=1500;render()}});render();
</script></body></html>
